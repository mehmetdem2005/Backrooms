name: APK Derle (Android)

# Bulutta APK derler ve indirilebilir artifact uretir.
# Manuel calistir (Actions sekmesi -> Run workflow) ya da kod degisince.

on:
  workflow_dispatch:
  push:
    branches: [ claude/asset-painting-plugin-wGWcn ]
    paths:
      - '**.gd'
      - '**.tscn'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'tools/dunya_uretici/dunya_plan.json'

env:
  GODOT: "4.6.3-stable"
  GODOT_TPL: "4.6.3.stable"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK paketleri
        run: sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" >/dev/null

      - name: Godot + export sablonlari
        run: |
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT}/Godot_v${GODOT}_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT}_linux.x86_64" godot && chmod +x godot
          curl -sL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT}/Godot_v${GODOT}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TPL}"
          unzip -q tpl.tpz -d tpl
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_TPL}/"

      - name: Debug keystore + editor ayarlari
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          # editor ayarlarini uret, sonra SDK + keystore yollarini enjekte et
          xvfb-run -a ./godot --headless --editor --quit 2>/dev/null || true
          ES=$(find "$HOME/.config/godot" -name "editor_settings-4*.tres" | head -1)
          python3 - "$ES" "$ANDROID_SDK_ROOT" "$PWD/debug.keystore" <<'PY'
          import sys,re
          p,sdk,ks=sys.argv[1],sys.argv[2],sys.argv[3]
          s=open(p).read()
          def setk(s,k,v):
              if k in s: return re.sub(k+r' = "[^"]*"', k+' = "'+v+'"', s)
              return s.replace("[resource]\n","[resource]\n"+k+' = "'+v+'"\n',1)
          s=setk(s,"export/android/android_sdk_path",sdk)
          s=setk(s,"export/android/debug_keystore",ks)
          s=setk(s,"export/android/debug_keystore_user","androiddebugkey")
          s=setk(s,"export/android/debug_keystore_pass","android")
          open(p,"w").write(s)
          PY

      - name: Import (ETC2 dokular)
        run: timeout 900 ./godot --headless --import 2>/dev/null || true

      - name: APK export (debug)
        run: |
          mkdir -p dist
          ./godot --headless --export-debug "Android" dist/Backrooms.apk
          ls -la dist/Backrooms.apk

      - name: APK'yi yukle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Backrooms-APK
          path: dist/Backrooms.apk
          if-no-files-found: error
