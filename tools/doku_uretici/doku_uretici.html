<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Doku Üretici — Sohbet</title>
<style>
  :root{ --bg:#0e0f12; --panel:#171a1f; --panel2:#1f242b; --line:#2a2f37; --txt:#e8eaed; --dim:#9aa3ad; --acc:#4f9cff; --me:#243447; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  body{ display:flex; flex-direction:column; }
  header{ display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  header b{ font-size:15px; } header .sp{ flex:1; }
  button,select,input,textarea{ font:inherit; color:var(--txt); }
  .icon{ background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  #chat{ flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .msg{ max-width:90%; padding:10px 12px; border-radius:14px; line-height:1.35; white-space:pre-wrap; word-wrap:break-word; }
  .me{ align-self:flex-end; background:var(--me); border-bottom-right-radius:4px; }
  .ai{ align-self:flex-start; background:var(--panel2); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .sys{ align-self:center; color:var(--dim); font-size:12px; background:transparent; }
  .msg img{ max-width:100%; border-radius:10px; display:block; margin-top:6px; }
  .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  .mini{ font-size:12px; padding:7px 11px; border-radius:9px; background:var(--acc); color:#fff; border:0; }
  .mini.alt{ background:var(--panel); border:1px solid var(--line); color:var(--txt); }
  footer{ background:var(--panel); border-top:1px solid var(--line); padding:8px; }
  .opts{ display:flex; gap:8px; align-items:center; margin-bottom:6px; font-size:12px; color:var(--dim); flex-wrap:wrap; }
  .opts label{ display:flex; gap:5px; align-items:center; }
  .inbar{ display:flex; gap:8px; align-items:flex-end; }
  textarea#prompt{ flex:1; resize:none; min-height:46px; max-height:140px; padding:11px; border-radius:12px; background:var(--panel2); border:1px solid var(--line); }
  #send{ background:var(--acc); border:0; border-radius:12px; padding:0 18px; height:46px; color:#fff; font-weight:600; }
  #send:disabled{ opacity:.5; }
  dialog{ background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:14px; width:92%; max-width:460px; padding:16px; }
  dialog h3{ margin:.2em 0 .6em; }
  dialog label{ display:block; font-size:12px; color:var(--dim); margin:10px 0 4px; }
  dialog input,dialog select{ width:100%; padding:10px; border-radius:10px; background:var(--panel2); border:1px solid var(--line); }
  .hint{ font-size:11px; color:var(--dim); margin-top:6px; line-height:1.4; }
  .spin{ width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;display:inline-block;animation:s .7s linear infinite;vertical-align:-3px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <b>🧱 Doku Üretici</b>
  <span class="sp"></span>
  <button class="icon" id="newchat" title="Yeni sohbet">🗑 Yeni</button>
  <button class="icon" id="opensettings">⚙️</button>
</header>

<div id="chat"></div>

<footer>
  <div class="opts">
    <label><input type="checkbox" id="attachlast"> Son görseli referans ekle</label>
    <label><input type="checkbox" id="autosave" checked> Otomatik indir</label>
    <span class="sp" style="flex:1"></span>
    <span id="modellbl" style="color:var(--acc)"></span>
  </div>
  <div class="inbar">
    <textarea id="prompt" placeholder="Ne üreteyim? (ör: backrooms için kirli ıslak fayans, dikişsiz, tepeden)"></textarea>
    <button id="send">Gönder</button>
  </div>
</footer>

<dialog id="settings">
  <h3>Ayarlar</h3>
  <label>Gemini API anahtarı (AI Studio'dan)</label>
  <input id="apikey" type="password" placeholder="AIza...">
  <label>Model</label>
  <select id="model">
    <option value="gemini-3-pro-image-preview">Nano Banana Pro (gemini-3-pro-image-preview)</option>
    <option value="gemini-2.5-flash-image">Nano Banana (gemini-2.5-flash-image) — ucuz</option>
    <option value="__custom">Özel (elle yaz)…</option>
  </select>
  <input id="modelcustom" style="display:none;margin-top:6px" placeholder="model id">
  <div class="hint">
    Anahtar: aistudio.google.com → Get API key. Cihazında saklanır, hiçbir yere gönderilmez (sadece Google API'sine).
    Model çalışmazsa AI Studio'daki güncel görsel model adını "Özel"e yaz.
    Not: API anahtarı $300 krediden değil, karttan/free-tier'dan gider (genelde sentler).
  </div>
  <div class="row" style="justify-content:flex-end;margin-top:14px">
    <button class="mini alt" id="closesettings">Kapat</button>
    <button class="mini" id="savesettings">Kaydet</button>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const chat = $('#chat');
const ENDPOINT = m => `https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`;
let history = [];          // {role, parts:[...]}  (metin bağlamı; görseller bağlama eklenmez = hafif)
let lastImage = null;      // {mime, b64} son üretilen görsel
let busy = false;
let imgCount = 0;

// --- Ayarlar (localStorage) ---
function getKey(){ return localStorage.getItem('gemini_key') || ''; }
function getModel(){ return localStorage.getItem('gemini_model') || 'gemini-3-pro-image-preview'; }
function refreshModelLbl(){ $('#modellbl').textContent = getModel(); }
refreshModelLbl();

$('#opensettings').onclick = ()=>{
  $('#apikey').value = getKey();
  const m = getModel();
  const sel = $('#model'); const known=[...sel.options].some(o=>o.value===m);
  if(known){ sel.value=m; $('#modelcustom').style.display='none'; }
  else { sel.value='__custom'; $('#modelcustom').style.display='block'; $('#modelcustom').value=m; }
  $('#settings').showModal();
};
$('#model').onchange = e=>{ $('#modelcustom').style.display = e.target.value==='__custom'?'block':'none'; };
$('#closesettings').onclick = ()=> $('#settings').close();
$('#savesettings').onclick = ()=>{
  localStorage.setItem('gemini_key', $('#apikey').value.trim());
  let m = $('#model').value; if(m==='__custom') m = $('#modelcustom').value.trim();
  localStorage.setItem('gemini_model', m || 'gemini-3-pro-image-preview');
  refreshModelLbl(); $('#settings').close();
};
$('#newchat').onclick = ()=>{ history=[]; lastImage=null; chat.innerHTML=''; addSys('Yeni sohbet. (Önceki bağlam temizlendi — token/payload sıfırlandı.)'); };

// --- UI yardımcıları ---
function bubble(cls){ const d=document.createElement('div'); d.className='msg '+cls; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d; }
function addUser(t){ const b=bubble('me'); b.textContent=t; }
function addSys(t){ const b=bubble('sys'); b.textContent=t; }
function addAItext(t){ const b=bubble('ai'); b.textContent=t; return b; }
function addAIimage(mime,b64){
  imgCount++;
  const b=bubble('ai');
  const img=document.createElement('img'); img.src=`data:${mime};base64,${b64}`; b.appendChild(img);
  const row=document.createElement('div'); row.className='row';
  const dl=document.createElement('button'); dl.className='mini'; dl.textContent='💾 İndir';
  const name = `doku_${imgCount}.png`;
  dl.onclick=()=>download(mime,b64,name);
  const ref=document.createElement('button'); ref.className='mini alt'; ref.textContent='↺ Referans yap';
  ref.onclick=()=>{ lastImage={mime,b64}; $('#attachlast').checked=true; addSys('Bu görsel referans seçildi. Sonraki mesajda kullanılacak (ör: "bunun normal haritasını yap").'); };
  row.appendChild(dl); row.appendChild(ref); b.appendChild(row);
  lastImage={mime,b64};
  if($('#autosave').checked) download(mime,b64,name);
}
function download(mime,b64,name){
  const a=document.createElement('a'); a.href=`data:${mime};base64,${b64}`; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
}

// --- Gönder ---
$('#send').onclick = send;
$('#prompt').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); }});

async function send(){
  if(busy) return;
  const key=getKey(); const model=getModel();
  const text=$('#prompt').value.trim();
  if(!key){ addSys('Önce ⚙️ ayarlardan API anahtarını gir.'); $('#settings').showModal(); return; }
  if(!text){ return; }

  const parts=[{text}];
  if($('#attachlast').checked && lastImage){
    parts.push({ inline_data:{ mime_type:lastImage.mime, data:lastImage.b64 } });
    addSys('(son görsel referans olarak eklendi)');
  }
  addUser(text);
  history.push({ role:'user', parts });
  $('#prompt').value='';
  busy=true; const sbtn=$('#send'); sbtn.disabled=true; sbtn.innerHTML='<span class="spin"></span>';
  const wait=addAItext('üretiliyor…');

  try{
    const body={ contents:history, generationConfig:{ responseModalities:["Text","Image"] } };
    const res=await fetch(ENDPOINT(model)+'?key='+encodeURIComponent(key),{
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
    });
    const data=await res.json();
    wait.remove();
    if(!res.ok){
      addSys('HATA '+res.status+': '+((data.error&&data.error.message)||JSON.stringify(data)).slice(0,300));
      // başarısız mesajı bağlamdan çıkar
      history.pop();
      return;
    }
    const cand=(data.candidates&&data.candidates[0])||null;
    const rparts=(cand&&cand.content&&cand.content.parts)||[];
    let gotImg=false, modelText='';
    for(const p of rparts){
      const inl=p.inlineData||p.inline_data;
      if(inl&&inl.data){ addAIimage(inl.mimeType||inl.mime_type||'image/png', inl.data); gotImg=true; }
      else if(p.text){ modelText+=p.text; }
    }
    if(modelText) addAItext(modelText);
    if(!gotImg && !modelText) addSys('Boş yanıt geldi. Promtu netleştir ya da modeli değiştir.');
    // bağlama SADECE metin ekle (görsel ekleme -> payload şişmesin)
    history.push({ role:'model', parts:[{text: gotImg ? '[görsel üretildi]' : (modelText||'')}] });
    // bağlam çok büyürse kırp
    if(history.length>16) history=history.slice(-16);
  }catch(err){
    wait.remove();
    addSys('Bağlantı hatası: '+err.message+'  (Tarayıcı CORS engellediyse sayfayı bir https adresinden açman gerekebilir — bana söyle.)');
    history.pop();
  }finally{
    busy=false; sbtn.disabled=false; sbtn.textContent='Gönder';
  }
}

// İlk açılış
if(!getKey()){ addSys('Hoş geldin. ⚙️ ayarlardan API anahtarını gir, sonra ne üreteceğini yaz.'); }
else { addSys('Hazır. Ne üreteyim? (ör: backrooms kirli ıslak fayans, dikişsiz, tepeden, 4K)'); }
addSys('İpucu: bir doku beğenince "↺ Referans yap" → "bunun normal/roughness haritasını yap" diyerek devam et.');
</script>
</body>
</html>
